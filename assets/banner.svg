<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Highlights -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    /* Dynamic Pipeline Animation Styles */
    @keyframes flowPulse {
      0% { stroke-dashoffset: 240; opacity: 0.3; }
      50% { opacity: 0.95; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.45; }
    }
    .flow-line {
      stroke-dasharray: 12 12;
      animation: flowPulse 4s linear infinite;
    }
    .card-float-1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 6s ease-in-out infinite 0.5s; }
    .card-float-3 { animation: floatCard3 5.5s ease-in-out infinite 1s; }
    .orb-glow { transform-origin: center; animation: pulseOrb 8s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Grid Backdrop (Low opacity) -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Glowing Ambient Orbs in Background -->
  <circle cx="150" cy="180" r="140" fill="#06b6d4" class="orb-glow" filter="url(#glow)" />
  <circle cx="1060" cy="90" r="130" fill="#8b5cf6" class="orb-glow" filter="url(#glow)" />
  <circle cx="980" cy="280" r="110" fill="#ec4899" class="orb-glow" filter="url(#glow)" />

  <!-- Animated Sales Pipeline Flow Lines (Behind text) -->
  <path d="M 60 290 Q 300 240 550 280 T 1140 250" fill="none" stroke="url(#cyanPurple)" stroke-width="3" class="flow-line" opacity="0.7" />
  <path d="M 90 320 Q 400 270 700 320 T 1160 290" fill="none" stroke="#06b6d4" stroke-width="2" class="flow-line" opacity="0.4" style="animation-duration: 6s;" />

  <!-- Left Side Pipeline Stage Card (Animated / Dynamic) -->
  <g class="card-float-1" transform="translate(45, 65)" filter="url(#cardShadow)">
    <rect width="180" height="95" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="28" r="8" fill="#06b6d4" />
    <text x="44" y="32" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">LEADS IN</text>
    <text x="24" y="64" fill="#f8fafc" font-size="22" font-weight="bold">124 New</text>
    <rect x="24" y="74" width="132" height="6" rx="3" fill="#1e293b" />
    <rect x="24" y="74" width="95" height="6" rx="3" fill="#06b6d4" />
  </g>

  <!-- Right Side Pipeline Stage Card 1 (Qualified Deals) -->
  <g class="card-float-2" transform="translate(970, 45)" filter="url(#cardShadow)">
    <rect width="190" height="95" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="28" r="8" fill="#8b5cf6" />
    <text x="44" y="32" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">QUALIFIED</text>
    <text x="24" y="64" fill="#f8fafc" font-size="22" font-weight="bold">$184,500</text>
    <rect x="24" y="74" width="142" height="6" rx="3" fill="#1e293b" />
    <rect x="24" y="74" width="112" height="6" rx="3" fill="#8b5cf6" />
  </g>

  <!-- Right Side Pipeline Stage Card 2 (Won Deals / Velocity) -->
  <g class="card-float-3" transform="translate(995, 175)" filter="url(#cardShadow)">
    <rect width="165" height="85" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="26" cy="26" r="7" fill="#10b981" />
    <text x="40" y="30" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1">WON DEALS</text>
    <text x="22" y="58" fill="#f8fafc" font-size="20" font-weight="bold">94.2% Rate</text>
    <text x="22" y="73" fill="#94a3b8" font-size="10">⚡ High Velocity</text>
  </g>

  <!-- Center Primary Hero Content (Foreground - Clear & Prominent) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Category Pill -->
    <g transform="translate(0, -68)">
      <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="0" y="5" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">🚀 CURATED DIRECTORY &amp; ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="8" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Small Business
    </text>
    <text x="0" y="56" fill="url(#cyanPurple)" font-size="42" font-weight="900" letter-spacing="-0.5">
      Pipeline CRM
    </text>

    <!-- Subtitle (Clear, readable foreground) -->
    <text x="0" y="104" fill="#cbd5e1" font-size="17" font-weight="400">
      The definitive guide to SaaS and open-source sales pipelines, deal tracking &amp; CRM platforms
    </text>

    <!-- Pills Container -->
    <g transform="translate(0, 142)">
      <!-- Pill 1: Open Source -->
      <g transform="translate(-165, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
        <text x="0" y="4" fill="#38bdf8" font-size="11" font-weight="600">⚡ Open Source</text>
      </g>
      <!-- Pill 2: Commercial SaaS -->
      <g transform="translate(0, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
        <text x="0" y="4" fill="#c084fc" font-size="11" font-weight="600">💼 Top SaaS</text>
      </g>
      <!-- Pill 3: Self-Hosted -->
      <g transform="translate(165, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
        <text x="0" y="4" fill="#f472b6" font-size="11" font-weight="600">🛡️ Self-Hosted</text>
      </g>
    </g>
  </g>
</svg>
